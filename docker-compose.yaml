name: localstand-dwh

x-airflow-common: &airflow-common
  build: .
  image: localstand-airflow:2.10.5-dbt1.5
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__ENABLE_XCOM_PICKLING: 'false'
    AIRFLOW__CORE__PARALLELISM: '4'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__WORKERS: '2'
    AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: '300'
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: '300'
    AIRFLOW__WEBSERVER__SECRET_KEY: local-dwh-demo-only
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW_CONN_SOURCE_POSTGRES: postgresql://postgres:postgres@client-postgres:5432/postgres
    AIRFLOW_CONN_GREENPLUM: postgresql://gpadmin:gpadmin@greenplum:5432/dwh
    GP_HOST: greenplum
    GP_PORT: '5432'
    GP_USER: gpadmin
    GP_PASSWORD: gpadmin
    GP_DATABASE: dwh
  volumes:
    # Shared SELinux labels also allow these mounts on Fedora/RHEL hosts.
    - ./airflow/dags:/opt/airflow/dags:ro,z
    - ./dbt_project:/dbt:ro,z
    - ./scripts:/opt/airflow/scripts:ro,z
    - ./greenplum:/opt/airflow/greenplum:ro,z
    - airflow-logs-volume:/opt/airflow/logs
  depends_on: &airflow-depends-on
    airflow-postgres:
      condition: service_healthy
  networks: [backend]

services:
  client-postgres:
    profiles: [source, dwh]
    image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:${SOURCE_PORT:-5051}:5432"]
    volumes:
      - source-db-volume:/var/lib/postgresql/data
      - ./client-postgres-init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      # TCP is unavailable during the image's temporary initialization server.
      test: ["CMD-SHELL", "PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -tAc 'SELECT count(*) FROM academy.orders' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [backend]

  greenplum:
    profiles: [dwh]
    image: woblerr/greenplum:6.27.1@sha256:f27652e7ecd5bdf21d4d10b54889e91abf37c7a24859ed8043d2782b3216a60e
    hostname: greenplum
    environment:
      GREENPLUM_PASSWORD: gpadmin
      GREENPLUM_DATABASE_NAME: dwh
      GREENPLUM_DEPLOYMENT: singlenode
      TZ: Etc/UTC
    ports: ["127.0.0.1:${GREENPLUM_PORT:-5433}:5432"]
    volumes:
      - greenplum-data-volume:/data
    shm_size: 1gb
    stop_grace_period: 90s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'source /usr/local/greenplum-db/greenplum_path.sh &&
          PGPASSWORD=gpadmin psql -h greenplum -U gpadmin -d dwh -v ON_ERROR_STOP=1
          -tAc "SELECT count(*) FROM gp_dist_random('\''pg_class'\'')" >/dev/null'
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 30
    restart: unless-stopped
    networks: [backend]

  airflow-postgres:
    image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      # PostgreSQL 13 data from the old Compose needs migration; use a fresh volume.
      - airflow-db-v16-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    command: version
    restart: 'no'

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["127.0.0.1:${AIRFLOW_PORT:-8080}:8080"]
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
      # A completed one-shot is also accounted for by compose up --wait.
      dwh-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  dwh-init:
    <<: *airflow-common
    profiles: [dwh]
    command: python /opt/airflow/scripts/enable_dwh.py
    depends_on:
      <<: *airflow-depends-on
      airflow-scheduler:
        condition: service_healthy
      client-postgres:
        condition: service_healthy
      greenplum:
        condition: service_healthy
    restart: 'no'

volumes:
  source-db-volume:
  greenplum-data-volume:
  airflow-db-v16-volume:
  airflow-logs-volume:

networks:
  backend:
