academy_dwh:
  target: dev
  outputs:
    dev:
      type: greenplum
      host: "{{ env_var('GP_HOST', 'greenplum') }}"
      port: "{{ env_var('GP_PORT', '5432') | int }}"
      user: "{{ env_var('GP_USER', 'gpadmin') }}"
      pass: "{{ env_var('GP_PASSWORD', 'gpadmin') }}"
      dbname: "{{ env_var('GP_DATABASE', 'dwh') }}"
      schema: public
      threads: 2
      connect_timeout: 15
